<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初中工具集</title>
<style>
  :root {
    --cyan:    #00f0ff;
    --magenta: #ff2fd6;
    --purple:  #a855f7;
    --green:   #39ff14;
    --yellow:  #ffe600;
    --bg:      #05060f;
    --bg-2:    #0b0d1a;
    --text:    #e6f7ff;
    --muted:   #8a93b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse at 20% 0%, rgba(0,240,255,.12), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(255,47,214,.12), transparent 50%),
      var(--bg);
    overflow-x: hidden;
    position: relative;
  }

  /* ===== 赛博网格背景 ===== */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,240,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,.05) 1px, transparent 1px);
    background-size: 42px 42px;
    pointer-events: none;
    z-index: 0;
  }

  /* ===== 顶部标题 ===== */
  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 64px 20px 20px;
  }

  h1 {
    font-size: clamp(32px, 6vw, 54px);
    font-weight: 800;
    letter-spacing: 8px;
    background: linear-gradient(90deg, var(--cyan), var(--purple), var(--magenta));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(0,240,255,.45));
    text-transform: uppercase;
  }

  header p {
    margin-top: 12px;
    color: var(--muted);
    font-size: 15px;
    letter-spacing: 3px;
  }

  /* ===== 分割线 ===== */
  .divider {
    position: relative;
    z-index: 1;
    width: min(640px, 80%);
    height: 2px;
    margin: 28px auto 0;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
    box-shadow: 0 0 12px rgba(0,240,255,.6);
  }

  /* ===== 卡片网格 ===== */
  main {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 20px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 28px;
  }

  .tool-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 36px 24px;
    min-height: 190px;
    text-decoration: none;
    text-align: center;
    color: var(--text);
    background: rgba(11, 13, 26, .72);
    border: 1px solid rgba(0,240,255,.35);
    border-radius: 16px;
    backdrop-filter: blur(6px);
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    position: relative;
    overflow: hidden;
  }

  /* 角标发光点 */
  .tool-card::after {
    content: "";
    position: absolute;
    top: -40%;
    left: -40%;
    width: 60%;
    height: 120%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
    transform: rotate(25deg) translateX(-200%);
    transition: transform .6s ease;
  }

  .tool-card:hover::after { transform: rotate(25deg) translateX(320%); }

  .tool-card:hover {
    transform: translateY(-6px);
  }

  /* 每种工具独立的霓虹配色 */
  .tool-card.c1 { border-color: rgba(0,240,255,.6); }
  .tool-card.c1:hover { box-shadow: 0 10px 40px rgba(0,240,255,.35); }

  .tool-card.c2 { border-color: rgba(255,47,214,.6); }
  .tool-card.c2:hover { box-shadow: 0 10px 40px rgba(255,47,214,.35); }

  .tool-card.c3 { border-color: rgba(57,255,20,.55); }
  .tool-card.c3:hover { box-shadow: 0 10px 40px rgba(57,255,20,.3); }

  .tool-card.c4 { border-color: rgba(255,230,0,.55); }
  .tool-card.c4:hover { box-shadow: 0 10px 40px rgba(255,230,0,.3); }

  /* 图标 */
  .icon {
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    border-radius: 14px;
    background: rgba(255,255,255,.06);
  }
  .c1 .icon { color: var(--cyan);    box-shadow: 0 0 16px rgba(0,240,255,.4);    border: 1px solid rgba(0,240,255,.4); }
  .c2 .icon { color: var(--magenta); box-shadow: 0 0 16px rgba(255,47,214,.4);   border: 1px solid rgba(255,47,214,.4); }
  .c3 .icon { color: var(--green);   box-shadow: 0 0 16px rgba(57,255,20,.35);   border: 1px solid rgba(57,255,20,.35); }
  .c4 .icon { color: var(--yellow);  box-shadow: 0 0 16px rgba(255,230,0,.35);   border: 1px solid rgba(255,230,0,.35); }

  .tool-card .name {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .tool-card .sub {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ===== 页脚 ===== */
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 3px;
    border-top: 1px solid rgba(0,240,255,.15);
  }

  footer .blink { color: var(--cyan); animation: blink 1.6s infinite; }
  @keyframes blink { 0%,100% {opacity:1} 50% {opacity:.25} }
</style>
</head>
<body>

<header>
  <h1>初中工具集</h1>
  <p>✦ MIDDLE SCHOOL TOOLBOX ✦</p>
</header>
<div class="divider"></div>

<main>
  <!-- 电路搭建工具 -->
  <a class="tool-card c1" href="circuit-construction-kit-ac_zh_CN.html">
    <div class="icon">⚡</div>
    <div class="name">电路搭建工具</div>
    <div class="sub">Circuit · 交流电路</div>
  </a>

  <!-- 二次函数图像 -->
  <a class="tool-card c2" href="二次函数图像graphing-quadratics_zh_CN.html">
    <div class="icon">📈</div>
    <div class="name">二次函数图像</div>
    <div class="sub">Quadratic · 函数图像</div>
  </a>

  <!-- 交流虚拟实验室 -->
  <a class="tool-card c3" href="交流虚拟实验室circuit-construction-kit-ac-virtual-lab_zh_CN.html">
    <div class="icon">🧪</div>
    <div class="name">交流虚拟实验室</div>
    <div class="sub">Virtual Lab · 虚拟实验</div>
  </a>

  <!-- 元素周期表 -->
  <a class="tool-card c4" href="元素周期表 · PERIODIC TABLE.html">
    <div class="icon">🧬</div>
    <div class="name">元素周期表</div>
    <div class="sub">Periodic Table · 化学</div>
  </a>
</main>

<footer>
  <span class="blink">⬢</span> 初中工具集 · CYBER NEON <span class="blink">⬢</span>
</footer>

</body>
</html>
