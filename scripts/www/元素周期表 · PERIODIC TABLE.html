<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>元素周期表 · Periodic Table</title>
<style>
/* ===== 基础 ===== */
* { box-sizing: border-box; }
:root {
  --bg: #0e1116;
  --panel: #151a21;
  --panel-2: #1b222c;
  --line: #27303d;
  --text: #eef2f7;
  --text-dim: #8b95a3;
  --cell: 58px;
  --gap: 5px;
}
html { -webkit-text-size-adjust: 100%; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
/* 实验室坐标纸纹理背景 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size: 46px 46px;
}
button { font-family: inherit; color: inherit; }
button:focus-visible { outline: 2px solid #4cddf3; outline-offset: 2px; }

/* ===== 布局 ===== */
.app { max-width: 1320px; margin: 0 auto; padding: 18px 16px calc(40px + env(safe-area-inset-bottom)); }
.hero { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 20px; margin-bottom: 14px; }
.hero h1 {
  margin: 0;
  font-size: clamp(22px, 3.4vw, 32px);
  letter-spacing: .04em;
  font-weight: 700;
}
.hero h1 .zh { text-shadow: 0 0 18px rgba(76,221,243,.45); }
.hero .sub { margin: 4px 0 0; color: var(--text-dim); font-size: 13px; letter-spacing: .12em; }

/* ===== 控制条 ===== */
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.search {
  display: flex; align-items: center; gap: 8px;
  flex: 1 1 220px; min-width: 160px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 12px; transition: border-color .2s;
}
.search:focus-within { border-color: #4cddf3; }
.search svg { width: 16px; height: 16px; stroke: var(--text-dim); flex: none; }
.search input {
  flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
  color: var(--text); font-size: 14px;
}
.search input::placeholder { color: #5b6572; }
.search .count { flex: none; font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.zbtn {
  flex: none; height: 34px; padding: 0 11px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  font-size: 12px; color: var(--text-dim); cursor: pointer; transition: .18s;
  display: inline-flex; align-items: center; gap: 5px;
}
.zbtn:hover { color: var(--text); border-color: #3d4a5c; }
.zbtn:active { transform: scale(.95); }
.zbtn svg { width: 14px; height: 14px; stroke: currentColor; }

/* ===== 图例 ===== */
.legend { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--panel); color: var(--text-dim);
  font-size: 12px; cursor: pointer; transition: .18s; user-select: none;
}
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 7px var(--c); }
.chip:hover { border-color: var(--c); color: var(--c); }
.chip.active { border-color: var(--c); color: var(--c); background: rgba(255,255,255,.045); box-shadow: 0 0 12px color-mix(in srgb, var(--c) 28%, transparent); }

/* ===== 周期表 ===== */
.table-wrap {
  overflow-x: auto; overflow-y: hidden;
  padding: 2px 2px 10px;
  scrollbar-width: thin; scrollbar-color: #33404f transparent;
  -webkit-overflow-scrolling: touch;
}
.periodic-table {
  display: grid;
  grid-template-columns: repeat(18, var(--cell));
  grid-auto-rows: var(--cell);
  grid-auto-flow: row;
  gap: var(--gap);
  width: max-content;
  min-width: 100%;
  margin: 0 auto;
}
.cell {
  position: relative;
  font-size: var(--cell);
  border: 1.5px solid var(--c);
  border-radius: 4px;
  background: rgba(17,21,27,.9);
  color: var(--c);
  text-shadow: 0 0 9px color-mix(in srgb, var(--c) 75%, transparent);
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .04em;
  transition: transform .14s ease, box-shadow .2s ease, opacity .2s ease, border-color .2s ease;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
  overflow: hidden;
}
.cell:hover { box-shadow: 0 0 16px color-mix(in srgb, var(--c) 50%, transparent), inset 0 0 12px color-mix(in srgb, var(--c) 16%, transparent); z-index: 2; }
.cell:active { transform: scale(.9); }
.cell .num { position: absolute; left: .1em; top: .08em; font-size: .14em; opacity: .78; line-height: 1; font-variant-numeric: tabular-nums; }
.cell .sym { font-size: .34em; font-weight: 600; line-height: 1; }
.cell .name { font-size: .14em; opacity: .85; line-height: 1.1; white-space: nowrap; }
.cell .mass { position: absolute; left: 0; right: 0; bottom: .06em; text-align: center; font-size: .12em; opacity: .72; font-variant-numeric: tabular-nums; }
.cell .econf { display: none; }

/* 占位格（镧系/锕系入口） */
.cell.placeholder {
  border-style: dashed;
  background: transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .05em;
}
.cell.placeholder:hover { box-shadow: 0 0 16px color-mix(in srgb, var(--c) 40%, transparent); }
.cell.placeholder .ph-sym { font-size: .3em; font-weight: 600; }
.cell.placeholder .ph-name { font-size: .12em; opacity: .8; }

/* 搜索/筛选状态 */
.cell.hit { box-shadow: 0 0 18px var(--c), inset 0 0 10px color-mix(in srgb, var(--c) 25%, transparent); }
.cell.dim-search, .cell.cat-dim { opacity: .16; filter: saturate(.4); }
.cell.dim-search:hover, .cell.cat-dim:hover { opacity: .3; }

/* ===== 详情弹窗 ===== */
dialog.modal { border: 0; padding: 0; background: transparent; width: min(600px, calc(100vw - 24px)); margin: auto; }
dialog.modal::backdrop { background: rgba(8,10,14,.74); backdrop-filter: blur(5px); }
.modal-card {
  position: relative;
  background: var(--panel);
  border: 1px solid #2c3746;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.02) inset;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
}
.modal-head .cat-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-dim);
}
.modal-head .cat-tag .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.close {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text-dim);
  font-size: 18px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  transition: .18s;
}
.close:hover { color: var(--text); border-color: #3d4a5c; }
.modal-body { display: flex; gap: 22px; padding: 20px 18px 16px; }
/* 原子模型 */
.atom-box { position: relative; flex: none; width: 240px; height: 240px; margin: 0 auto; max-width: 100%; aspect-ratio: 1; }
.nucleus {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: 44px; height: 44px; border-radius: 50%;
  background: color-mix(in srgb, var(--c) 24%, #10151b);
  border: 1.5px solid var(--c);
  box-shadow: 0 0 22px color-mix(in srgb, var(--c) 70%, transparent);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; color: var(--c); text-shadow: 0 0 10px var(--c);
  z-index: 2;
}
.orbit { position: absolute; border: 1px solid var(--c); border-radius: 50%; opacity: .32; animation: orbit-spin linear infinite; }
@keyframes orbit-spin { to { transform: rotate(360deg); } }
.electron {
  position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px;
  border-radius: 50%; background: var(--c);
  box-shadow: 0 0 8px var(--c);
}
/* 信息 */
.info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.info .big-sym { font-size: clamp(40px, 9vw, 60px); font-weight: 700; line-height: 1; color: var(--c); text-shadow: 0 0 22px color-mix(in srgb, var(--c) 65%, transparent); }
.info h2 { margin: 6px 0 12px; font-size: 20px; font-weight: 600; }
.info h2 .zh { color: #52ee61; text-shadow: 0 0 10px rgba(82,238,97,.5); }
.info h2 .en { color: var(--text-dim); font-weight: 400; font-size: 15px; margin-left: 8px; }
.info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 13px; }
.info dl > div { display: contents; }
.info dt { color: var(--text-dim); white-space: nowrap; }
.info dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-all; color: #52ee61; text-shadow: 0 0 8px rgba(82,238,97,.45); }
.info dd .conf-num { color: #52ee61; }
.modal-nav {
  display: flex; gap: 10px; padding: 0 18px 18px;
}
.modal-nav button {
  flex: 1; padding: 10px 0; border-radius: 10px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text-dim);
  font-size: 13px; cursor: pointer; transition: .18s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.modal-nav button:hover { color: var(--text); border-color: #3d4a5c; }
.modal-nav svg { width: 14px; height: 14px; stroke: currentColor; }
.empty {
  padding: 30px; text-align: center; color: var(--text-dim); font-size: 14px;
}

@media (max-width: 768px) {
  :root { --cell: 45px; }
  .modal-body { flex-direction: column; gap: 6px; }
  .info { text-align: center; align-items: center; }
  .info dl { grid-template-columns: 1fr; gap: 2px; text-align: center; }
  .info dt { white-space: normal; }
}
@media (max-width: 420px) {
  :root { --cell: 43px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>

</dialog>

const CATS = {

  'alkaline-earth-metal':  { name: '碱土金属',   color: '#dee955' },

  'actinoid':              { name: '锕系',       color: '#c686cc' },

  'post-transition-metal': { name: '后过渡金属', color: '#4cddf3' },
  'metalloid':             { name: '类金属',     color: '#3aefb6' },
  'other-nonmetal':        { name: '其他非金属', color: '#52ee61' },

  'unknown':               { name: '未知性质',   color: '#9aa4b2' }
};
const GROUP_ZH = { 1:'ⅠA',2:'ⅡA',3:'ⅢB',4:'ⅣB',5:'ⅤB',6:'ⅥB',7:'ⅦB',8:'Ⅷ',9:'Ⅷ',10:'Ⅷ',11:'ⅠB',12:'ⅡB',13:'ⅢA',14:'ⅣA',15:'ⅤA',16:'ⅥA',17:'ⅦA',18:'0' };

const $ = (s) => document.querySelector(s);
const table = $('#ptable');
const wrap = $('#table-wrap');
const cells = {};

/* ===== 构建周期表 ===== */
function buildTable() {
  ELEMENTS.forEach(el => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cell';
    b.dataset.num = el.num;
    b.style.setProperty('--c', CATS[el.cat].color);
    b.style.gridRow = el.row;
    b.style.gridColumn = el.col;
    b.setAttribute('aria-label', el.sym + ' ' + el.nameZh + '，原子序数 ' + el.num);
    b.innerHTML =
      '<span class="num">' + el.num + '</span>' +
      '<span class="sym">' + el.sym + '</span>' +
      '<span class="name" data-en="' + el.nameEn + '">' + el.nameZh + '</span>' +
      '<span class="mass">' + el.mass + '</span>';
    b.addEventListener('click', () => openDetail(el.num));
    table.appendChild(b);
    cells[el.num] = b;
  });
  // 占位格：镧系 / 锕系入口
  addPlaceholder(6, 3, 'La', '镧系 57–71', CATS.lanthanoid.color, 'lanthanoid');
  addPlaceholder(7, 3, 'Ac', '锕系 89–103', CATS.actinoid.color, 'actinoid');
}
function addPlaceholder(row, col, sym, name, color, cat) {
  const d = document.createElement('div');
  d.className = 'cell placeholder';
  d.style.setProperty('--c', color);
  d.style.gridRow = row;
  d.style.gridColumn = col;
  d.innerHTML = '<span class="ph-sym">' + sym + '</span><span class="ph-name">' + name + '</span>';
  d.addEventListener('click', () => {
    const targetRow = cat === 'lanthanoid' ? 9 : 10;
    const first = ELEMENTS.find(e => e.row === targetRow);
    if (first && cells[first.num]) scrollToCell(cells[first.num], true);
    highlightCat(cat);
  });
  table.appendChild(d);
}

/* ===== 图例 ===== */
const legend = $('#legend');
const chips = [];
function buildLegend() {
  Object.keys(CATS).forEach(cat => {
    const c = CATS[cat];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.dataset.cat = cat;
    b.style.setProperty('--c', c.color);
    b.innerHTML = '<span class="dot"></span>' + c.name;
    b.addEventListener('click', () => {
      activeCat = activeCat === cat ? null : cat;
      applyCatFilter();
    });
    legend.appendChild(b);
    chips.push(b);
  });
}
let activeCat = null;
function applyCatFilter() {
  ELEMENTS.forEach(el => {
    cells[el.num].classList.toggle('cat-dim', !!activeCat && el.cat !== activeCat);
  });
  chips.forEach(ch => ch.classList.toggle('active', ch.dataset.cat === activeCat));
}
function highlightCat(cat) {
  activeCat = activeCat === cat ? null : cat;
  applyCatFilter();
}

/* ===== 缩放 ===== */
let cellSize = 58;
function setCellSize(v) {
  cellSize = Math.max(18, Math.min(84, v));
  document.documentElement.style.setProperty('--cell', cellSize + 'px');
}
$('#zoom-in').addEventListener('click', () => setCellSize(cellSize + 4));
$('#zoom-out').addEventListener('click', () => setCellSize(cellSize - 4));
$('#zoom-fit').addEventListener('click', () => {
  const avail = wrap.clientWidth;
  const v = Math.floor((avail - 17 * 5) / 18);
  setCellSize(Math.max(12, v));
});

/* ===== 搜索 ===== */
const search = $('#search');
const searchCount = $('#search-count');
let lastQuery = '';
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  lastQuery = q;
  let count = 0, first = null;
  ELEMENTS.forEach(el => {
    const cell = cells[el.num];
    if (!q) {
      cell.classList.remove('hit', 'dim-search');
      return;
    }
    const hit = String(el.num) === q ||
      el.sym.toLowerCase().includes(q) ||
      el.nameEn.toLowerCase().includes(q) ||
      el.nameZh.includes(q);
    cell.classList.toggle('hit', hit);
    cell.classList.toggle('dim-search', !hit);
    if (hit) { count++; if (!first) first = cell; }
  });
  searchCount.textContent = q ? count + ' 个匹配' : '';
  if (first) scrollToCell(first, false);
});

/* ===== 滚动到元素 ===== */
function scrollToCell(cell, vertical) {
  const targetLeft = cell.offsetLeft - wrap.clientWidth / 2 + cell.clientWidth / 2;
  try {
    wrap.scrollTo({ left: Math.max(0, targetLeft), behavior: 'smooth' });
    if (vertical) {
      const top = cell.offsetTop + wrap.offsetTop - window.innerHeight / 2;
      window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    }
  } catch (e) {
    wrap.scrollLeft = Math.max(0, targetLeft);
    if (vertical) window.scrollTo(0, Math.max(0, cell.offsetTop - 60));
  }
}

/* ===== 详情弹窗 ===== */
const modal = $('#modal');
function openDetail(num) {
  const target = Math.max(1, Math.min(118, num));
  if (location.hash !== '#/el/' + target) {
    history.replaceState ? history.replaceState(null, '', '#/el/' + target) : (location.hash = '#/el/' + target);
  }
  renderModal(target);
  if (!modal.open) modal.showModal();
}
function renderModal(num) {
  const el = ELEMENTS[num - 1];
  const cat = CATS[el.cat];
  $('#m-cat-tag').style.setProperty('--c', cat.color);
  $('#m-cat-name').textContent = cat.name;
  $('#m-sym').textContent = el.sym;
  $('#m-sym').style.setProperty('--c', cat.color);
  $('#m-name').innerHTML = '<span class="zh">' + el.nameZh + '</span><span class="en">' + el.nameEn + '</span>';
  $('#m-num').textContent = el.num;
  $('#m-mass').textContent = el.mass;
  $('#m-conf').innerHTML = el.econfig.map(v => '<span class="conf-num">' + v + '</span>').join(' &nbsp; ');
  const period = el.row <= 7 ? el.row : (el.row === 9 ? 6 : 7);
  const group = el.row <= 7 ? (GROUP_ZH[el.col] || el.col) : '镧系/锕系';
  $('#m-period').textContent = '第 ' + period + ' 周期 · 第 ' + group + ' 族';
  buildAtom(el);
}
function buildAtom(el) {
  const box = $('#atom-box');
  box.innerHTML = '';
  box.style.setProperty('--c', CATS[el.cat].color);
  const size = 240;
  const n = el.econfig.length;
  // 原子核
  const nucleus = document.createElement('div');
  nucleus.className = 'nucleus';
  nucleus.textContent = el.num;
  box.appendChild(nucleus);
  // 各电子层
  el.econfig.forEach((cnt, i) => {
    const frac = n === 1 ? 0.34 : (0.16 + i * (0.40 - 0.16) / (n - 1));
    const d = Math.max(24, size * (1 - 2 * frac));
    const orbit = document.createElement('div');
    orbit.className = 'orbit';
    orbit.style.width = d + 'px';
    orbit.style.height = d + 'px';
    orbit.style.left = (size - d) / 2 + 'px';
    orbit.style.top = (size - d) / 2 + 'px';
    orbit.style.animationDuration = (16 + i * 10) + 's';
    const r = d / 2;
    for (let e = 0; e < cnt; e++) {
      const dot = document.createElement('i');
      dot.className = 'electron';
      const ang = e * (360 / cnt);
      dot.style.transform = 'rotate(' + ang + 'deg) translateX(' + (r - 4) + 'px)';
      orbit.appendChild(dot);
    }
    box.appendChild(orbit);
  });
}
$('#m-close').addEventListener('click', () => { modal.close(); clearHash(); });
modal.addEventListener('click', (ev) => { if (ev.target === modal) { modal.close(); clearHash(); } });
$('#m-prev').addEventListener('click', () => {
  const m = location.hash.match(/#\/el\/(\d+)/);
  const n = m ? +m[1] : 1;
  openDetail(Math.max(1, n - 1));
});
$('#m-next').addEventListener('click', () => {
  const m = location.hash.match(/#\/el\/(\d+)/);
  const n = m ? +m[1] : 1;
  openDetail(Math.min(118, n + 1));
});
function clearHash() {
  if (history.replaceState) history.replaceState(null, '', location.pathname + location.search);
  else location.hash = '';
}
window.addEventListener('hashchange', () => {
  const m = location.hash.match(/^#\/el\/(\d+)$/);
  if (m) { renderModal(+m[1]); if (!modal.open) modal.showModal(); }
});
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.open) clearHash(); });

/* ===== 初始化 ===== */
function init() {
  buildTable();
  buildLegend();
  // 初始格宽按视口自适应（桌面铺满，移动端保留可读宽度）
  const desktop = window.innerWidth > 768;
  cellSize = desktop ? 58 : 46;
  document.documentElement.style.setProperty('--cell', cellSize + 'px');
  if (desktop) {
    const avail = wrap.clientWidth;
    const fit = Math.floor((avail - 17 * 5) / 18);
    if (fit < cellSize) setCellSize(Math.max(12, fit));
  }
  // 恢复 hash 选中的元素
  const m = location.hash.match(/^#\/el\/(\d+)$/);
  if (m) { renderModal(+m[1]); modal.showModal(); }
}
init();
</script>
